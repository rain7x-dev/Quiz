<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#46178f">
  <title>Join Quiz</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="player">
  <div id="offline" class="offline hidden">Reconnecting…</div>
  <header class="topbar">
    <div class="brand">Live Quiz</div>
    <div id="me" class="me hidden"></div>
  </header>

  <main>
    <section id="s-join" class="screen">
      <div class="card narrow">
        <h1>Join the quiz</h1>
        <form id="joinForm" autocomplete="off">
          <input id="pinInput" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="Game PIN" required>
          <input id="nameInput" maxlength="20" placeholder="Nickname" required>
          <button id="joinBtn" class="primary big" type="submit">Enter</button>
        </form>
        <p id="joinError" class="error"></p>
      </div>
    </section>

    <section id="s-connecting" class="screen center hidden">
      <div class="spinner"></div>
      <p class="muted">Connecting…</p>
    </section>

    <section id="s-lobby" class="screen center hidden">
      <h1>You're in!</h1>
      <p id="lobbyName" class="big-name"></p>
      <p class="muted">See your name on the screen?<br>Waiting for the host to start…</p>
    </section>

    <section id="s-question" class="screen hidden">
      <div class="q-meta">
        <span id="pCounter"></span>
        <span id="pTimer" class="timer pill"></span>
      </div>
      <h2 id="pText" class="p-q"></h2>
      <div id="pOptions" class="options player-options"></div>
    </section>

    <section id="s-locked" class="screen center hidden">
      <div class="spinner"></div>
      <h1 id="lockedTitle">Answer locked in</h1>
      <p class="muted">Waiting for the others…</p>
    </section>

    <section id="s-result" class="screen center hidden">
      <div id="resIcon" class="result-icon"></div>
      <h1 id="resTitle"></h1>
      <p id="resPoints" class="points"></p>
      <p id="resAnswer" class="muted"></p>
      <p id="resRank" class="rank"></p>
    </section>

    <section id="s-end" class="screen center hidden">
      <div id="endIcon" class="result-icon"></div>
      <h1 id="endTitle"></h1>
      <p id="endScore" class="points"></p>
      <p id="endRank" class="rank"></p>
      <p class="muted">Thanks for playing!</p>
    </section>

    <section id="s-kicked" class="screen center hidden">
      <h1>You were removed</h1>
      <p class="muted">The host removed you from this game.</p>
      <button id="rejoinBtn" class="primary big">Join again</button>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/player.js"></script>
</body>
</html>
